services:
  db:
    image: mysql:8.0
    container_name: tdconnect-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    container_name: tdconnect-app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000

volumes:
  mysql-data:

